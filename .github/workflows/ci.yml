name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Software rasterizers: lavapipe on Linux, WARP on Windows.
      # macOS runners use their Metal device; GPU tests skip if none exists.
      PATINA_SOFTWARE_GPU: ${{ runner.os != 'macOS' && '1' || '0' }}
      PATINA_REQUIRE_GPU: ${{ runner.os != 'macOS' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries and lavapipe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev mesa-vulkan-drivers
      - name: Unit and snapshot tests
        run: cargo test --workspace
      - name: Headless CLI snapshot
        if: runner.os != 'macOS'
        run: cargo run -p patina_app -- --snapshot cli-snapshot.png --primitive torus --size 640x360
      - name: Upload snapshot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.os }}
          path: |
            target/snapshot-failures/
            cli-snapshot.png
          if-no-files-found: ignore
